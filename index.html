<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8f5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/manifest.json"><title>日日 — 日記</title><style>
:root{--ink:#272923;--muted:#85877f;--paper:#f8f8f5;--line:#e8e9e2;--green:#738e6c;--glass:rgba(255,255,255,.72)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}button,textarea{font:inherit}button{color:inherit}.skeleton{position:fixed;inset:0;z-index:100;background:#f8f8f5;padding:calc(22px + env(safe-area-inset-top)) 22px;transition:opacity .35s ease}.skeleton .bar{height:10px;border-radius:8px;background:linear-gradient(90deg,#ebede7,#f4f4ef,#ebede7);background-size:200% 100%;animation:shimmer 1.3s infinite}.skeleton .brandbar{width:75px;height:20px;margin:8px 0 65px}.skeleton .wide{height:150px;border-radius:24px;margin:16px 0}.skeleton .row{display:flex;gap:10px}.skeleton .row .bar{height:78px;flex:1;border-radius:18px;margin:8px 0 18px}.skeleton .short{width:42%;margin:14px 0}.skeleton .medium{width:70%;margin:12px 0}@keyframes shimmer{to{background-position:-200% 0}}body.ready .skeleton{opacity:0;pointer-events:none}.app{max-width:480px;min-height:100svh;margin:auto;padding:env(safe-area-inset-top) 22px calc(92px + env(safe-area-inset-bottom));position:relative;overflow:hidden}.sky{height:340px;position:absolute;inset:0 0 auto;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,#e8efec 0%,#f4f3eb 58%,transparent 100%);transition:background 1.2s ease}.sky:before,.sky:after{content:"";position:absolute;border-radius:50%;filter:blur(1px)}.sky:before{width:240px;height:110px;top:182px;left:-25px;background:rgba(159,178,146,.38);border-radius:60% 70% 0 0}.sky:after{width:290px;height:135px;top:205px;right:-80px;background:rgba(119,151,120,.24);border-radius:65% 65% 0 0}.app[data-growth="2"] .sky{background:linear-gradient(180deg,#dcebe6,#f1f1e7 62%,transparent)}.app[data-growth="3"] .sky{background:linear-gradient(180deg,#d5e8e0,#e9eee1 65%,transparent)}.app[data-growth="4"] .sky{background:linear-gradient(180deg,#cde4db,#e6ecda 65%,transparent)}.content{position:relative;z-index:1}.top{height:62px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-size:21px;letter-spacing:.04em}.profile{border:1px solid #ffffffaa;border-radius:50px;background:var(--glass);backdrop-filter:blur(14px);width:38px;height:38px;display:grid;place-items:center;font-size:15px}.date{padding-top:32px;color:#656b61;font-size:13px;letter-spacing:.05em}.greeting{font:400 31px/1.35 Georgia,"Hiragino Mincho ProN",serif;margin:10px 0 2px;letter-spacing:.02em}.sub{color:#74776f;font-size:13px;margin:0}.landscape{height:100px;position:relative}.sun{position:absolute;right:48px;top:22px;width:44px;height:44px;background:#f4d8a8;border-radius:50%;box-shadow:0 0 42px #f4d8a877}.leaf{position:absolute;bottom:6px;width:25px;height:48px;background:#789477;border-radius:100% 0 100% 0;transform:rotate(-18deg);opacity:.85;transition:all .8s}.leaf.a{left:25%;height:37px;width:21px}.leaf.b{left:31%;height:62px}.leaf.c{left:37%;height:44px;transform:rotate(25deg)}.leaf.d{left:69%;height:39px;width:20px;transform:rotate(20deg);background:#91a681}.app[data-growth="2"] .leaf{transform:scale(1.12) rotate(-18deg);height:65px}.app[data-growth="3"] .leaf{transform:scale(1.35) rotate(-18deg);height:80px;background:#66876c}.app[data-growth="4"] .leaf{transform:scale(1.55) rotate(-18deg);height:95px;background:#547a62}.tabs{display:flex;gap:8px;margin:3px 0 16px}.tab{border:1px solid transparent;background:transparent;color:#83867f;padding:9px 13px;border-radius:40px;font-size:12px}.tab.active{background:#fff;border-color:#eeefe9;color:var(--ink);box-shadow:0 3px 12px #28332209}.section-title{font-size:14px;font-weight:600;margin:18px 0 11px}.glass-card{background:var(--glass);border:1px solid #fff;border-radius:22px;backdrop-filter:blur(18px);box-shadow:0 8px 30px #3543320b;padding:17px}.checkin{display:flex;align-items:center;justify-content:space-between}.checkin p{font-size:11px;color:var(--muted);margin:0 0 10px}.moods{display:flex;gap:7px}.mood{width:39px;height:39px;border:1px solid #e9ebe5;background:#fff9;border-radius:50%;font-size:19px;display:grid;place-items:center;transition:.22s;cursor:pointer}.mood.selected{background:#e7ede1;border-color:#9aaf91;transform:scale(1.1)}.checkin-side{border-left:1px solid var(--line);padding-left:15px;min-width:88px}.checkin-side strong{display:block;font-size:12px;font-weight:500}.checkin-side span{display:block;color:var(--muted);font-size:10px;margin-top:5px}.journal-head{display:flex;align-items:center;justify-content:space-between}.journal-head .section-title{margin:0}.small{font-size:11px;color:var(--muted)}.write-card{margin-top:11px;padding:15px 17px}.write-top{display:flex;align-items:center;gap:9px;color:#878b80;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#91a98b}.write-card textarea{border:0;outline:0;resize:none;background:transparent;width:100%;min-height:72px;padding:12px 0 2px;font-size:14px;line-height:1.7;color:var(--ink)}textarea::placeholder{color:#a6a79f}.write-bottom{display:flex;align-items:center;justify-content:space-between}.hint{font-size:10px;color:#9b9d96}.save{border:0;border-radius:40px;background:#788e72;color:#fff;padding:10px 17px;font-size:12px;cursor:pointer;transition:transform .2s,background .2s}.save:active{transform:scale(.96)}.save.saved{background:#506f59}.feature-title{display:flex;align-items:center;justify-content:space-between;margin-top:20px}.feature-title .section-title{margin:0 0 10px}.dots{color:#a5a79f;font-size:11px;letter-spacing:3px}.carousel{display:flex;gap:10px;overflow:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:6px}.carousel::-webkit-scrollbar{display:none}.feature{scroll-snap-align:start;flex:0 0 145px;height:102px;border:1px solid #fff;border-radius:18px;background:linear-gradient(145deg,#ffffffd9,#f0f1ebaa);backdrop-filter:blur(14px);padding:14px;text-align:left;cursor:pointer;transition:transform .22s,box-shadow .22s}.feature:active{transform:scale(.97)}.feature .ico{font-size:17px}.feature strong{display:block;font-weight:500;font-size:12px;margin-top:10px}.feature span{display:block;color:#93958c;font-size:10px;margin-top:4px}.streak{margin-top:14px;display:flex;align-items:center;gap:9px;color:#74786e;font-size:11px}.streak b{color:#536e4d;font-weight:600}.nav{position:fixed;z-index:8;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);padding:10px 24px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:#f9f9f4cf;border-top:1px solid #e5e7df88;backdrop-filter:blur(22px)}.nav button{border:0;background:none;color:#95978e;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:3px 15px}.nav button.active{color:#647e60}.nav i{font-style:normal;font-size:19px}.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,12px);z-index:20;background:#30362fef;color:white;padding:11px 17px;border-radius:30px;font-size:12px;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{position:fixed;inset:0;z-index:30;background:#1b201d44;backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{width:min(480px,100%);background:#fbfbf8;border-radius:27px 27px 0 0;padding:25px 24px calc(28px + env(safe-area-inset-bottom));animation:rise .32s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{transform:translateY(40px);opacity:.7}to{transform:translateY(0);opacity:1}}.sheet h2{font:400 23px Georgia,serif;margin:0 0 8px}.sheet p{font-size:13px;line-height:1.8;color:#74776f}.close{float:right;border:0;border-radius:50%;width:33px;height:33px;background:#f0f1eb;font-size:17px}.entry{padding:13px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.7}.entry time{display:block;color:#92948a;font-size:10px;margin-bottom:4px}.empty{padding:18px 0;color:#898b82;font-size:13px}.crumb{font-size:11px;color:#97998f;margin:0 0 14px}.crumb button{border:0;background:none;color:#748c6d;padding:0}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div class="skeleton" id="loading" aria-label="読み込み中"><div class="bar brandbar"></div><div class="bar short"></div><div class="bar medium"></div><div class="bar wide"></div><div class="row"><div class="bar"></div><div class="bar"></div></div><div class="bar short"></div><div class="bar wide"></div></div><main class="app" id="app" data-growth="1"><div class="sky"></div><div class="content"><header class="top"><div class="brand">日日</div><button class="profile" aria-label="プロフィール">◯</button></header><div class="date" id="date"></div><h1 class="greeting">今日は、どんな日？</h1><p class="sub">ひとことだけでも、十分です。</p><div class="landscape"><div class="sun"></div><i class="leaf a"></i><i class="leaf b"></i><i class="leaf c"></i><i class="leaf d"></i></div><div class="tabs"><button class="tab active" data-tab="today">今日</button><button class="tab" data-tab="week">今週</button><button class="tab" data-tab="month">今月</button></div><section><div class="section-title">いまの体調</div><div class="glass-card checkin"><div><p>午前の気分</p><div class="moods" data-period="午前"><button class="mood">😊</button><button class="mood">🙂</button><button class="mood">😐</button><button class="mood">😕</button><button class="mood">😣</button></div></div><div class="checkin-side"><strong>午前の記録</strong><span>あとからでも大丈夫</span></div></div><div class="glass-card checkin" style="margin-top:9px"><div><p>午後の気分</p><div class="moods" data-period="午後"><button class="mood">😊</button><button class="mood">🙂</button><button class="mood">😐</button><button class="mood">😕</button><button class="mood">😣</button></div></div><div class="checkin-side"><strong>午後の記録</strong><span>空欄があっても大丈夫</span></div></div></section><section><div class="journal-head"><div class="section-title">寝る前の日記</div><span class="small" id="wordcount">0文字</span></div><div class="glass-card write-card"><div class="write-top"><i class="dot"></i>今日のことを、少しだけ</div><textarea id="journal" maxlength="1000" placeholder="よかったことも、そうでないことも。"></textarea><div class="write-bottom"><span class="hint">短い言葉でも、記録になります</span><button class="save" id="save">記録する</button></div></div></section><section><div class="feature-title"><div class="section-title">ふりかえる</div><span class="dots">● ○ ○</span></div><div class="carousel"><button class="feature" data-action="history"><span class="ico">▤</span><strong>日記をみる</strong><span>これまでの記録</span></button><button class="feature" data-action="summary"><span class="ico">⌁</span><strong>今週のふりかえり</strong><span>体調と記録をみる</span></button><button class="feature" data-action="ai"><span class="ico">✧</span><strong>気持ちを整理する</strong><span>日記から小さな気づき</span></button></div><div class="streak">✦ <span>あなたの小さな庭 <b id="days">0日分</b>の記録</span></div></section></div></main><nav class="nav"><button class="active" data-nav="home"><i>⌂</i>今日</button><button data-nav="history"><i>▤</i>日記</button><button data-nav="summary"><i>◷</i>ふりかえり</button><button data-nav="settings"><i>⚙</i>設定</button></nav><div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="sheet"><button class="close" id="close">×</button><p class="crumb"><button id="back">今日</button>　›　<span id="crumb-label"></span></p><div id="sheet-content"></div></div></div><script>
const key='hibi-diary-v1',emojis=['😊','🙂','😐','😕','😣'];let state=JSON.parse(localStorage.getItem(key)||'{"days":{}}');const today=new Date(),dateKey=today.toLocaleDateString('sv-SE');document.getElementById('date').textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'long'}).format(today);const app=document.getElementById('app'),journal=document.getElementById('journal'),toast=document.getElementById('toast');function day(){return state.days[dateKey]||(state.days[dateKey]={moods:{},text:''})}function persist(){localStorage.setItem(key,JSON.stringify(state));render()}function render(){day();journal.value=day().text;document.getElementById('wordcount').textContent=day().text.length+'文字';document.querySelectorAll('.moods').forEach(group=>group.querySelectorAll('.mood').forEach((b,i)=>b.classList.toggle('selected',day().moods[group.dataset.period]===i)));let n=Object.values(state.days).filter(x=>x.text||Object.keys(x.moods).length).length;document.getElementById('days').textContent=n+'日分';app.dataset.growth=Math.min(4,1+Math.floor(n/3))}function ping(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(ping.t);ping.t=setTimeout(()=>toast.classList.remove('show'),2000)}document.querySelectorAll('.moods').forEach(g=>g.addEventListener('click',e=>{if(!e.target.classList.contains('mood'))return;day().moods[g.dataset.period]=[...g.children].indexOf(e.target);persist();ping(g.dataset.period+'の気分を記録しました')}));journal.addEventListener('input',()=>{day().text=journal.value;document.getElementById('wordcount').textContent=journal.value.length+'文字';localStorage.setItem(key,JSON.stringify(state))});document.getElementById('save').onclick=()=>{day().text=journal.value;persist();document.getElementById('save').classList.add('saved');document.getElementById('save').textContent='記録しました';ping('今日の記録を保存しました')};function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function openSheet(label,html){document.getElementById('crumb-label').textContent=label;document.getElementById('sheet-content').innerHTML=html;document.getElementById('overlay').classList.add('open')}function history(){let items=Object.entries(state.days).filter(([,d])=>d.text||Object.keys(d.moods).length).sort((a,b)=>b[0].localeCompare(a[0]));openSheet('日記',items.length?'<h2>これまでの日記</h2>'+items.map(([k,d])=>'<div class="entry"><time>'+new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(new Date(k+'T12:00:00'))+'</time>'+(d.moods['午前']!==undefined?'午前 '+emojis[d.moods['午前']]+'　':'')+(d.moods['午後']!==undefined?'午後 '+emojis[d.moods['午後']]+'<br>':'')+esc(d.text||'')+'</div>').join(''):'<h2>日記</h2><div class="empty">記録はまだありません。今日の気分をひとつ残してみませんか。</div>')}function summary(){let start=new Date(Date.now()-6*864e5).toLocaleDateString('sv-SE'),arr=Object.entries(state.days).filter(([k,d])=>k>=start&&(d.text||Object.keys(d.moods).length)),avg=arr.flatMap(([,d])=>Object.values(d.moods)).filter(Number.isFinite);openSheet('今週のふりかえり','<h2>今週のふりかえり</h2><p>記録した日　<strong>'+arr.length+'日</strong></p><p>体調の記録　<strong>'+avg.length+'回</strong></p><p>日記の文字数　<strong>'+arr.reduce((s,[,d])=>s+(d.text||'').length,0)+'文字</strong></p><p>書けた日も、書けなかった日も、どちらもあなたの一週間です。</p>')}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='history')history();if(b.dataset.action==='summary')summary();if(b.dataset.action==='ai')openSheet('気持ちを整理する','<h2>気持ちを整理する</h2><p>今週の日記から、振り返りの問いをつくります。</p><button class="save" id="ask-ai">問いをつくる</button><div id="ai-result"></div>')});document.addEventListener('click',async e=>{if(e.target.id==='ask-ai'){let days=Object.entries(state.days).filter(([,d])=>d.text).slice(-7);if(!days.length){document.getElementById('ai-result').innerHTML='<p>まずは日記をひとこと残してみてください。</p>';return}e.target.disabled=true;e.target.textContent='考えています…';try{let r=await fetch('/api/reflect',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({entries:days.map(([date,d])=>({date,text:d.text,moods:d.moods}))})});let data=await r.json();document.getElementById('ai-result').innerHTML='<p>'+esc(data.prompt||'振り返りを作成できませんでした')+'</p>'}catch{document.getElementById('ai-result').innerHTML='<p>振り返り機能はCloudflareの設定後に使えます。</p>'}finally{e.target.disabled=false;e.target.textContent='もう一度つくる'}}});document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('open');document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.currentTarget.classList.remove('open')};document.getElementById('back').onclick=()=>document.getElementById('overlay').classList.remove('open');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n===b));if(b.dataset.nav==='history')history();if(b.dataset.nav==='summary')summary();if(b.dataset.nav==='settings')openSheet('設定','<h2>設定</h2><p>この端末に記録を保存しています。記録はこのブラウザー内に保管されます。</p><button class="save" id="export">記録を書き出す</button> <button class="save" id="clear-data" style="background:#a46d63">記録を消去</button>')});document.addEventListener('click',e=>{if(e.target.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='hibi-diary.json';a.click();URL.revokeObjectURL(a.href)}if(e.target.id==='clear-data'&&confirm('この端末の記録をすべて消去しますか？')){state={days:{}};persist();document.getElementById('overlay').classList.remove('open');ping('記録を消去しました')}});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));if(b.dataset.tab==='today')return;let start=new Date(Date.now()-(b.dataset.tab==='week'?6:29)*864e5).toLocaleDateString('sv-SE'),arr=Object.entries(state.days).filter(([k,d])=>k>=start&&(d.text||Object.keys(d.moods).length));openSheet(b.dataset.tab==='week'?'今週':'今月','<h2>'+(b.dataset.tab==='week'?'今週':'今月')+'の記録</h2>'+ (arr.length?arr.map(([k,d])=>'<div class="entry"><time>'+k+'</time>'+esc(d.text||'気分を記録しました')+'</div>').join(''):'<div class="empty">この期間の記録はまだありません。</div>'))});render();window.addEventListener('load',()=>{document.body.classList.add('ready');setTimeout(()=>document.getElementById('loading')?.remove(),380)});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
